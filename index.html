<style>
  :root{

  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text)}
  header{padding:14px 20px;background:linear-gradient(90deg,#1a2138,#141a2b);border-bottom:1px solid #2a3350;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  header h1{font-size:17px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:12px}
  .badge{background:var(--accent);color:#08211e;font-size:11px;padding:3px 8px;border-radius:20px;font-weight:700}

  /* ---- Oynatıcı ---- */
  .player{position:sticky;top:57px;z-index:15;background:#12182a;border-bottom:1px solid #2a3350;
    padding:10px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button{background:var(--panel2);color:var(--text);border:1px solid #33406a;border-radius:8px;
    padding:9px 15px;font-size:14px;cursor:pointer;transition:.15s;font-weight:600}
  button:hover{background:#27314f;border-color:var(--accent)}
  button.primary{background:var(--accent);color:#08211e;border-color:var(--accent)}
  button.primary:hover{background:#63e0d3}
  button.warn{background:var(--accent2);color:#2b1a05;border-color:var(--accent2)}

  .player label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .player select,.player input[type=range]{background:var(--panel2);color:var(--text);
    border:1px solid #33406a;border-radius:6px;padding:5px}
  .now{font-size:12px;color:var(--accent);min-width:180px}

  .layout{display:grid;grid-template-columns:300px 1fr;gap:0;min-height:calc(100vh - 110px)}
  /* ---- Liste ---- */
  nav{background:var(--panel);border-right:1px solid #2a3350;overflow-y:auto;max-height:calc(100vh - 110px);position:sticky;top:110px}
  nav .grp{padding:9px 14px;font-size:11px;letter-spacing:1px;color:var(--accent);background:#131a2c;
    border-top:1px solid #232c48;border-bottom:1px solid #232c48;text-transform:uppercase;position:sticky;top:0}

  nav .item:hover{background:#1e2640}
  nav .item.active{background:#243055;border-left:3px solid var(--accent)}
  nav .item .meta{font-size:11px;color:var(--muted);margin-top:3px}
  .stars{color:var(--accent2);font-size:11px;letter-spacing:1px}
  .tag{display:inline-block;background:#2b3a63;color:#a9c0ff;font-size:10px;padding:1px 6px;border-radius:4px;margin-right:4px}

  /* ---- İçerik ---- */
  main{padding:22px 28px 60px;max-width:1000px}
  .card{background:var(--panel);border:1px solid var(--step-border);border-radius:12px;margin-bottom:18px;overflow:hidden}
  .card .head{padding:14px 18px;background:var(--panel2);border-bottom:1px solid var(--step-border)}
  .card .head h2{margin:0 0 6px;font-size:16px}
  .prompt{padding:15px 18px;font-size:14.5px;line-height:1.65;background:#141a2c;border-left:3px solid var(--accent2)}
  .prompt b{color:var(--accent2)}
  .steps{padding:12px 18px 18px}
  .step{border:1px solid var(--step-border);border-left:4px solid #33406a;border-radius:8px;
    padding:11px 14px;margin:9px 0;background:#141b2e;transition:.25s;opacity:.62}
  .step .no{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.5px}
  .step p{margin:6px 0 0;font-size:14px;line-height:1.6}
  .step.speaking{opacity:1;border-left-color:var(--accent);background:#1b2a45;
    box-shadow:0 0 0 1px var(--accent) inset, 0 4px 18px rgba(79,209,197,.12);transform:translateX(3px)}
  .step.done{opacity:.9;border-left-color:var(--ok)}
  pre{background:var(--code);border:1px solid #26304c;border-radius:7px;padding:11px 13px;margin:9px 0 0;
    font-family:Consolas,"Courier New",monospace;font-size:13px;line-height:1.55;overflow-x:auto;color:#c8f5e4}
  pre .c{color:#6b7ba6}
  .answer{margin-top:12px;padding:11px 14px;background:#12301f;border:1px solid #2c6b4a;border-radius:8px;
    font-size:14.5px;color:#9ff0c4;font-weight:600}
  .answer::before{content:"✔ SONUÇ: ";color:var(--ok)}
  .warnbox{margin-top:10px;padding:10px 13px;background:#3a2a10;border:1px solid #7c5a1e;border-radius:8px;
    font-size:13.5px;color:#f6cc7a}
  .warnbox::before{content:"⚠ DİKKAT: ";font-weight:700}
  .hint{font-size:13px;color:var(--muted);margin-top:8px;font-style:italic}
  .hidden{display:none}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
  @media(max-width:820px){.layout{grid-template-columns:1fr}nav{max-height:220px;position:relative;top:0}}
</style>
</head>

const QUESTIONS = [

/* ---------- SORU 1: TEMELLER ---------- */
{
 grp:"Soru 1 · Temeller",
 title:"ISA sınıfları: PIC16F877A hangi sınıfta?",
 exam:["2023","2024","2025","STM32"], stars:3,
 prompt:"PIC16F877A işlemcisi karmaşıklık türünden ve kod işleme biçimi türünden hangi ISA sınıflarına dahildir? Ayrıca STM32F401 için aynı sınıflar nedir?",
 steps:[

  {t:"PIC16F877A'yı yerleştir",

   code:"PIC16F877A\n  Karmaşıklık        : RISC\n  Kod işleme biçimi  : Register-Memory (kayıtçı-bellek)\n  Bellek erişimi     : Harvard"},
  {t:"STM32F401'ü yerleştir",

   code:"STM32F401 (Cortex-M4)\n  Karmaşıklık        : RISC\n  Kod işleme biçimi  : Register-Register (Load-Store)\n  Bellek erişimi     : Harvard"},
  {t:"Ezber kalıbı",
   s:"Hatırlatma şöyle: PIC yani eski mikrodenetleyiciler kayıtçı-bellek, yeni ARM Cortex-M işlemciler kayıtçı-kayıtçı. İki grup da RISC. Bellek erişimi olarak ikisi de Harvard. Bu dört cümleyi tekrar edersen bu blok sorusu biter."}
 ],
 answer:"PIC: RISC + Register-Memory · STM32F401: RISC + Register-Register (Load-Store) · ikisi de Harvard"

{
 grp:"Soru 1 · Temeller",
 title:"Mikromimari'nin 2 görevi ve ISA ilişkisi",

 steps:[
  {t:"İki görev — bu iki cümleyi ezberle",
   s:"Mikromimarinin iki görevi şudur. Bir: verilen komutları almak ve yorumlamak, yani çözümlemek. İki: komutların istediği işlemleri gerçekleştirmek, yani işlemek. Sınavda bu iki cümle aynen yazılır."},
  {t:"ISA ilişkisi",
   s:"ISA, komutları, parametreleri ve işleme biçimlerini tanımlayan soyut bir standarttır. Mikromimari ise o standartı gerçekleyen donanımdır. Bu yüzden ISA mikromimariyi şekillendirir, onu belirler."},
  {t:"Aynı ISA farklı mikromimari olur mu?",
   s:"Olur. Farklı üreticiler, fikri ve sınai haklar, performans veya fiyat gibi nedenlerle aynı ISA'yı çalıştıran farklı mikromimariler üretilebilir. Klasik örnek Intel ve AMD'in x86'sıdır. Sınavda bu üç kelimeyi yaz: farklı üreticiler, performans, fiyat."},
  {t:"Bit sayısını ne belirler?",
   s:"Bu konuyla birlikte sorulan ikinci soru: İşlemcinin kaç bitlik olduğunu ALU'nun bit sayısı belirler. ALU ise mikromimarinin ikinci görevi olan işlemleri gerçekleştirme göreviyle ilişkilidir."}
 ],
 answer:"Mikromimari = (1) komutları almak ve yorumlamak, (2) işlemleri gerçekleştirmek · ISA mikromimariyi şekillendirir · bit sayısını ALU belirler"
},
{
 grp:"Soru 1 · Temeller",
 title:"Stack (yığıt): amaç, yer, taşma, macro",
 exam:["2022","2023","2024","2025"], stars:3,
 prompt:"Bir işlemcide stack öncelikli olarak hangi amaçla kullanılır? Diğer kullanım amaçları nedir? Stack nerede tutulur? Stack taşması nedir? Macro'lar stack'i etkiler mi?",
 steps:[
  {t:"Öncelikli amaç — birinci cümle",

  {t:"Diğer kullanım",

  {t:"Nerede tutulur ve taşma",
   s:"Stack RAM üzerinde tutulur. Çalışma sırası LIFO'dur, son giren ilk çıkar. Saklamaya PUSH, geri almaya POP denir. Stack taşması ise stack'in boyutuna sığmayacak kadar çok bilgi saklanmaya çalışılmasıdır, örneğin çok fazla iç içe çağrı."},
  {t:"Macro etkiler mi? — sık sorulan tuzak",

  {t:"Ek bilgi: PIC ve heap",
   s:"PIC16F877'de stack 8 seviyelidir ve stack işaretçisine programdan erişilemez; yalnızca CALL, RETURN, RETFIE ve RETLW kullanır. Heap ile farkı ise şudur: stack PC değerini yedekler, heap ise geçici ve yerel değişkenler için kullanılır."}
 ],
 answer:"Temel amaç: PC'yi yedeklemek · RAM'de tutulur, LIFO · taşma = kapasite aşımı · macro stack'i etkilemez"
},
{
 grp:"Soru 1 · Temeller",
 title:"Adres yolu hesapları (32 MB → 24 bit)",
 exam:["2022","2023","2024","2025"], stars:3,
 prompt:"16 bitlik bir işlemci, 16 bitlik veri yolu üzerinden toplam 32 MB'lık bir veriyi adresleyebiliyorsa kaç adet adres yoluna sahip olmalıdır? Ayrıca 16 bit işlemci, 17 bit adres yolu ise Flash kaç KB? 32 bit adres yolu kaç GB?",
 steps:[
  {t:"Formülü kur",
   s:"İki formül var. Kapasite eşittir kapı sayısı çarpı her kapıdaki byte. Kapı sayısı ise 2 üzeri N, yani adres yolu bit sayısı. Tersinden gideceğiz: önce kaç adres gerektiğini bulacağız, sonra 2'nin kaçıncı kuvveti olduğunu yazacağız."},
  {t:"Her adreste kaç byte?",
   s:"Veri yolu 16 bit ise her adreste 2 byte var, çünkü 16 bölü 8 eşittir 2. 32 MB'ı 2 byte'a bölelim: 32 MB bölü 2 eşittir 16 M adres. Yani 16 milyon adet kapı numarası gerekiyor."},
  {t:"16 M'yi 2'nin kuvvetine çevir",
   s:"16 M demek 2 üzeri 4 çarpı 2 üzeri 20 demek, çünkü 16 ise 2 üzeri 4 ve 1 M ise 2 üzeri 20. Üsler toplanır, 4 artı 20 eşittir 24. Demek ki 24 bit adres yolu gerekiyor. Cevap: 24 bit."},
  {t:"Diğer iki kalıbı da pekiştir",
   s:"İkinci kalıp: 16 bit işlemci, 17 bit adres yolu. 2 üzeri 17 eşittir 128 K adres, her adreste 2 byte, 128 K çarpı 2 eşittir 256 KB. Üçüncü kalıp: 32 bit adres yolu. 2 üzeri 32 eşittir 4 G adres, her adreste 1 byte ise 4 GB. Bunları ezbere değil, üsleri toplayarak çöz."},
  {t:"Üç kavramı ayır",
   s:"Dikkat: adres yolu kapı sayısını, veri yolu her kapıdaki veri miktarını, ALU ise işlemcinin kaç bitlik olduğunu belirler. Üçü birbirinden bağımsızdır. 2025'te sorulan ALU 16 bit, adres yolu 32 bit sorusunda işlemci 16 bit, adreslenen bellek 4 GB çıkmıştı."}
 ],
 answer:"32 MB / 2 byte = 16M = 2^24 → 24 bit adres yolu · 17 bit → 256 KB · 32 bit → 4 GB"
},
{
 grp:"Soru 1 · Temeller",
 title:"MPU vs MCU, Cortex-A vs Cortex-M",
 exam:["2022","STM32"], stars:2,
 prompt:"Mikroişlemciler ile mikrodenetleyiciler arasındaki fark nedir? Hangi durumda mikroişlemciler tercih edilir? Cortex-A ile Cortex-M arasındaki temel fark nedir, gömülü sistemler için hangisi uygundur?",
 steps:[
  {t:"MPU — mikroişlemci",

  {t:"MCU — mikrodenetleyici",
   s:"MCU yani mikrodenetleyici ise bellek ve çevre birimlerini kendi içinde barındırır. Yazılım iç bellekten çalışır. Küçük, son kullanıcı sistemlerinde, yani gömülü sistemlerde tercih edilir."},
  {t:"Cortex-A ve Cortex-M karşılığı",
   s:"Aynı farkın ARM ayağı: Cortex-A dış bellek gerektiren, yüksek hızlı genel amaçlı uygulama işlemcisidir. Cortex-M ise belleğini içinde barındıran gömülü sistem işlemcisidir. Gömülü sistem için uygun olan Cortex-M'dir."},
  {t:"Tek cümlelik ezber",
   s:"İçinde MMU varsa ve dış bellek istiyorsa MPU yani işlemci, her şeyi içinde taşıyorsa MCU yani gömülü. Gömülü sistem = MCU = Cortex-M."}
 ],
 answer:"MPU: dış bellek + MMU, genel amaçlı · MCU: bellek ve çevre birimi içinde, gömülü sistemler için · gömülü = Cortex-M"

{
 grp:"Soru 1 · Temeller",

 steps:[
  {t:"Hız sıralaması",

  {t:"Kalıcılık ve ömür",

  {t:"Ne nerede?",
   s:"Flash'da program kodları ve sabitler durur. EEPROM'da ise saklanması gereken ama kullanıcı tarafından değiştirilebilen parametreler durur, örneğin ayarlar ve kalibrasyon değerleri."},
  {t:"Hocanın 2025 tuzağı",
   s:"Dikkat: hocanın 2025 çözümünde yazma ömrü için yalnızca SRAM'in sonsuz olduğu söylenmiş. Sınavda Flash ve EEPROM'un yazma ömrünün de sınırlı olduğunu yazman gerekir."}
 ],

{

{

/* ============================================================
   ARAYÜZ VE KONUŞMA MOTORU
   ============================================================ */
const listEl = document.getElementById('list');
const contentEl = document.getElementById('content');
const nowEl = document.getElementById('nowPlaying');
const rateEl = document.getElementById('rate');
const rateValEl = document.getElementById('rateVal');
const voiceSel = document.getElementById('voiceSel');

let current = 0;
let stepEls = [];
let speaking = false;
let paused = false;
let playAll = false;
let stepIndex = 0;
let utter = null;
let voices = [];

/* ---- Sesleri yükle ---- */
function loadVoices(){
  voices = speechSynthesis.getVoices();
  const tr = voices.filter(v => /tr/i.test(v.lang));
  const use = tr.length ? tr : voices;
  voiceSel.innerHTML = use.map((v,i)=>`<option value="${voices.indexOf(v)}">${v.name} (${v.lang})</option>`).join('');
}
loadVoices();
if (typeof speechSynthesis !== 'undefined') speechSynthesis.onvoiceschanged = loadVoices;

/* ---- Listeyi oluştur ---- */
function buildList(){
  let html = '', lastGrp = '';
  QUESTIONS.forEach((q,i)=>{
    if(q.grp !== lastGrp){ html += `<div class="grp">${q.grp}</div>`; lastGrp = q.grp; }
    const stars = '★'.repeat(q.stars) + '☆'.repeat(3-q.stars);
    html += `<div class="item" data-i="${i}">
      <div>${q.title}</div>
      <div class="meta"><span class="stars">${stars}</span> ${q.exam.map(e=>`<span class="tag">${e}</span>`).join('')}</div>
    </div>`;
  });
  listEl.innerHTML = html;
  listEl.querySelectorAll('.item').forEach(el=>{
    el.addEventListener('click', ()=>{ stop(); playAll=false; select(+el.dataset.i); });
  });
}

/* ---- Soruyu göster ---- */
function select(i){
  current = i;
  const q = QUESTIONS[i];
  const stars = '★'.repeat(q.stars) + '☆'.repeat(3-q.stars);
  let html = `<div class="card">
    <div class="head">
      <h2>${q.title}</h2>
      <div class="meta"><span class="stars">${stars}</span> ${q.exam.map(e=>`<span class="tag">${e}</span>`).join('')} · ${q.grp}</div>
    </div>
    <div class="prompt"><b>Soru:</b> ${q.prompt}</div>`;
  if(q.code) html += `<div class="steps"><pre>${q.code}</pre></div>`;
  html += `<div class="steps" id="steps">`;
  q.steps.forEach((s,idx)=>{
    html += `<div class="step" data-s="${idx}">
      <div class="no">ADIM ${idx+1} — ${s.t}</div>
      <p>${s.s}</p>
      ${s.code?`<pre>${s.code}</pre>`:''}
    </div>`;
  });
  html += `</div><div class="steps"><div class="answer">${q.answer}</div>
    <div class="hint">💡 İpucu: “Anlatımı Başlat” dediğinde bu sorunun adımları sırayla seslendirilir ve aktif adım vurgulanır.</div>
  </div></div>`;
  contentEl.innerHTML = html;
  stepEls = [...contentEl.querySelectorAll('.step')];
  listEl.querySelectorAll('.item').forEach(el=>el.classList.toggle('active', +el.dataset.i===i));
  nowEl.textContent = `${i+1}/${QUESTIONS.length} · ${q.title}`;
}

/* ---- Metni cümlelere böl (mobil Safari'de uzun metin kesilmesini önler) ---- */
function splitForSpeech(text){
  const parts = text.match(/[^.!?]+[.!?]*/g) || [text];
  const out = [];
  let cur = "";
  for(let p of parts){
    p = p.trim(); if(!p) continue;
    if((cur + " " + p).trim().length > 180 && cur){ out.push(cur); cur = p; }
    else cur = (cur ? cur + " " : "") + p;
    while(cur.length > 260){ // çok uzun parça varsa boşluktan böl
      let cut = cur.lastIndexOf(" ", 200);
      if(cut < 50) cut = 200;
      out.push(cur.slice(0, cut)); cur = cur.slice(cut).trim();
    }
  }
  if(cur) out.push(cur);
  return out;
}

/* ---- Metni seslendir (parça parça, mobil uyumlu) ---- */
function speak(text, onDone){
  if(!('speechSynthesis' in window)){ onDone && onDone(); return; }
  speechSynthesis.cancel();
  const chunks = splitForSpeech(text);
  let i = 0;
  const next = ()=>{
    if(i >= chunks.length){ onDone && onDone(); return; }
    const u = new SpeechSynthesisUtterance(chunks[i++]);
    u.lang = 'tr-TR';
    const vIdx = +voiceSel.value;
    if(voices[vIdx]) u.voice = voices[vIdx];
    u.rate = +rateEl.value;
    u.pitch = 1;
    // onend gelmezse (iOS hatası) veya ses hatasında da ilerle, takılmasın
    u.onend   = ()=>{ if(!paused) next(); };
    u.onerror = ()=>{ if(!paused) next(); };
    speechSynthesis.speak(u);
  };
  next();
}

/* ---- Adım adım anlat ---- */
function playSteps(from){
  if(from >= QUESTIONS[current].steps.length){
    // soru bitti
    stepEls.forEach(el=>el.classList.remove('speaking'));
    if(playAll){
      if(current < QUESTIONS.length-1){
        select(current+1);
        setTimeout(()=>playSteps(0), 700);
      } else {
        playAll = false;
        speaking = false;
        document.getElementById('btnPlay').textContent = '▶ Anlatımı Başlat';
        nowEl.textContent = '📚 Tüm sorular tamamlandı — tekrar dinlemek için başlatın';
        speechSynthesis.cancel();
      }
    } else {
      speaking = false;
      document.getElementById('btnPlay').textContent = '▶ Anlatımı Başlat';
      nowEl.textContent = '✔ Soru anlatımı tamamlandı';
    }
    return;
  }
  const q = QUESTIONS[current];
  const s = q.steps[from];
  stepIndex = from;
  stepEls.forEach((el,idx)=>{
    el.classList.toggle('speaking', idx===from);
    el.classList.toggle('done', idx<from);
  });
  stepEls[from].scrollIntoView({behavior:'smooth', block:'center'});
  nowEl.textContent = `${q.title} — adım ${from+1}/${q.steps.length}`;
  const msg = `${s.t}. ${s.s}`;
  speak(msg, ()=>{ if(speaking) playSteps(from+1); });
}

/* ---- Kontroller ---- */
document.getElementById('btnPlay').addEventListener('click', ()=>{
  if(!('speechSynthesis' in window)){ alert('Tarayıcınız sesli okumayı desteklemiyor. Chrome veya Edge deneyin.'); return; }
  if(speaking && paused){
    paused = false;
    speechSynthesis.resume();
    document.getElementById('btnPlay').textContent = '⏸ Anlatılıyor...';
    return;
  }
  if(speaking) return;
  speaking = true; paused = false;
  document.getElementById('btnPlay').textContent = '⏸ Anlatılıyor...';
  playSteps(0);
});

document.getElementById('btnPause').addEventListener('click', ()=>{
  if(!speaking) return;
  paused = true;
  speechSynthesis.pause();
  document.getElementById('btnPlay').textContent = '▶ Devam Et';
  nowEl.textContent = '⏸ Duraklatıldı';
});

document.getElementById('btnStop').addEventListener('click', stop);
function stop(){
  speaking = false; paused = false; playAll = false;
  speechSynthesis.cancel();
  stepEls.forEach(el=>el.classList.remove('speaking','done'));
  document.getElementById('btnPlay').textContent = '▶ Anlatımı Başlat';
  nowEl.textContent = '⏹ Durduruldu';
}

document.getElementById('btnPrev').addEventListener('click', ()=>{ stop(); if(current>0) select(current-1); });
document.getElementById('btnNext').addEventListener('click', ()=>{ stop(); if(current<QUESTIONS.length-1) select(current+1); });

document.getElementById('btnAll').addEventListener('click', ()=>{
  stop();
  playAll = true; speaking = true; paused = false;
  select(0);
  document.getElementById('btnPlay').textContent = '⏸ Anlatılıyor...';
  setTimeout(()=>playSteps(0), 500);
});

rateEl.addEventListener('input', ()=>{ rateValEl.textContent = (+rateEl.value).toFixed(2)+'x'; });

/* ---- Klavye ---- */
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.code==='Space'){ e.preventDefault(); document.getElementById('btnPlay').click(); }
  if(e.key==='ArrowRight'){ document.getElementById('btnNext').click(); }
  if(e.key==='ArrowLeft'){ document.getElementById('btnPrev').click(); }
});

buildList();
select(0);
</script>
</body>
</html>
